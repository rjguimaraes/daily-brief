name: Painel diário

on:
  # O agendamento do GitHub atrasa com frequência (10/10/2026: disparou às 11h46
  # em vez de 05h50). Três disparos redundantes; a execução é idempotente, então
  # rodar mais de uma vez só atualiza o que mudou.
  schedule:
    - cron: "17 6 * * *"   # 03h17 em Brasília
    - cron: "17 8 * * *"   # 05h17 em Brasília
    - cron: "7 9 * * *"    # 06h07 em Brasília (rede de segurança)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Carga histórica completa (demora ~1 h)"
        type: boolean
        default: false
      only:
        description: "Coletar só estas fontes, separadas por espaço (ex.: btc). Vazio = todas"
        default: ""
      agro_inbox:
        description: "Pacote .zip do agro enviado pelo notebook (data/agro_inbox/...). Envia o painel por e-mail se houver dado novo"
        default: ""

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml xlrd openpyxl
      - name: Testes das fórmulas
        run: python -m unittest discover -s tests -v
      - name: Coleta, cálculo e validação
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AGRO_INBOX: ${{ inputs.agro_inbox }}
        run: python scripts/run_panel.py ${{ inputs.backfill && '--backfill' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${AGRO_INBOX:+--agro-inbox "$AGRO_INBOX"}
      - name: Clima das propriedades
        continue-on-error: true   # falha no clima não derruba o painel
        run: python scripts/run_weather.py
      - run: cat output/panel.md output/weather.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Salvar séries e saídas
        env:
          AGRO_INBOX: ${{ inputs.agro_inbox }}
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ "$AGRO_INBOX" =~ ^data/agro_inbox/[A-Za-z0-9_.-]+\.zip$ ]] && [ -f "$AGRO_INBOX" ]; then git rm -q "$AGRO_INBOX"; fi
          git add data output
          git commit -m "Painel $(TZ=America/Sao_Paulo date +%Y-%m-%d)" || echo "nada a salvar"
          git pull --rebase -q
          git push
      # Coleta do agro pelo notebook do leitor (desde 18/11/2026): manda o painel em PDF por e-mail.
      - name: Preparar PDF do painel
        if: ${{ inputs.agro_inbox != '' }}
        run: pip install markdown playwright && python -m playwright install --with-deps chromium
      - name: Enviar painel por e-mail
        if: ${{ inputs.agro_inbox != '' }}
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PANEL_EMAIL_TO: ${{ secrets.PANEL_EMAIL_TO }}
        run: python scripts/send_panel_email.py

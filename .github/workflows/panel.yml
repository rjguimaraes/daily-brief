name: Painel diário

on:
  # O agendamento do GitHub atrasa com frequência (10/10/2026: disparou às 11h46
  # em vez de 05h50). Três disparos redundantes; a execução é idempotente, então
  # rodar mais de uma vez só atualiza o que mudou.
  schedule:
    - cron: "17 6 * * *"   # 03h17 em Brasília
    - cron: "17 8 * * *"   # 05h17 em Brasília
    - cron: "7 9 * * *"    # 06h07 em Brasília (rede de segurança)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Carga histórica completa (demora ~1 h)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml xlrd
      - name: Testes das fórmulas
        run: python -m unittest discover -s tests -v
      - name: Coleta, cálculo e validação
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/run_panel.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: Clima das propriedades
        continue-on-error: true   # falha no clima não derruba o painel
        run: python scripts/run_weather.py
      - run: cat output/panel.md output/weather.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Salvar séries e saídas
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output
          git commit -m "Painel $(TZ=America/Sao_Paulo date +%Y-%m-%d)" || echo "nada a salvar"
          git pull --rebase -q
          git push

name: Teste da chave FRED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/check_fred.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Salvar resultado
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/probe/fred_check.json
          git commit -m "Teste da chave FRED" || echo "nada a salvar"
          git push
